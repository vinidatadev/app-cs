services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: organograma
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-net

  # MinIO temporariamente desabilitado - causando problemas no Swarm
  # Descomente quando resolver o problema de tasks rejeitadas
  # minio:
  #   image: minio/minio:RELEASE.2024-10-13T13-34-11Z
  #   command: ["server", "/data", "--console-address", ":9001"]
  #   environment:
  #     MINIO_ROOT_USER: minioadmin
  #     MINIO_ROOT_PASSWORD: minioadmin123456
  #   volumes:
  #     - minio_data:/data
  #   networks:
  #     - app-net
  #   deploy:
  #     replicas: 1

  postgrest:
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: postgres://authenticator:postgrest_local_pwd@postgres:5432/organograma
      PGRST_DB_SCHEMAS: public
      PGRST_JWT_SECRET: ${SECRET_KEY:-chave-secreta-jwt-local-minimo-32-caracteres}
      PGRST_SERVER_PORT: 3000
      PGRST_LOG_LEVEL: info
    ports:
      - "3001:3000"
    depends_on:
      - postgres
    networks:
      - app-net

  backend:
    image: organograma-backend:latest
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/organograma
      SECRET_KEY: ${SECRET_KEY:-chave-secreta-jwt-local-minimo-32-caracteres}
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      CORS_ORIGINS: ${CORS_ORIGINS:-http://10.0.103.20:3000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123456}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_BUCKETS: imagens,transacoes,task-attachments
      SEED_ASSETS_DIR: /app/seed-assets
      SEED_ASSETS_ON_START: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@empresa.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    networks:
      - app-net

  frontend:
    image: organograma-frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
      - postgrest
    networks:
      - app-net

volumes:
  postgres_data:
  minio_data:

networks:
  app-net:
    driver: overlay
    attachable: true
